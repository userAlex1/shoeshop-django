{% extends "base.html" %}
{% block content %}
<div class="text-center py-5">
    <h1 class="text-success">✅ Payment Successful!</h1>
    <p class="lead">Thank you, {{ order.full_name }}. Your order <strong>{{ order.order_number }}</strong> has been placed.</p>
    <p>Total paid: KES {{ order.total_amount }}</p>
    <a href="{% url 'store:product_list' %}" class="btn btn-dark">Continue Shopping</a>
</div>
{% endblock %}
